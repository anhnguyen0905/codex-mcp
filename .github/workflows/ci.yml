name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  consistency:
    name: release & command consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-release-consistency.mjs
      - run: node scripts/check-command-sync.mjs

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # Coverage thresholds (vitest.config.ts) gate CI on one matrix cell only,
      # so the rest of the matrix stays fast with a plain test run.
      - name: test with coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx vitest run --coverage
      - name: test
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: npx vitest run

  # Runs on all three OSes: the packed tarball must install and answer the MCP
  # handshake everywhere the plugin is installed, not just on Linux (R9.2).
  package-smoke:
    name: pack & install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # pack-smoke.mjs shells out to `tar`; keep it on the runner it was written for.
      - name: pack & install smoke (tarball contents)
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/pack-smoke.mjs
      - name: npm smoke (packed tarball, MCP handshake)
        timeout-minutes: 10
        run: node scripts/npm-smoke.mjs --tarball-from-pack

  # Live end-to-end smoke against a real Codex CLI session.
  # Opt-in: set the repository variable CODEX_E2E_ENABLED to 'true'
  # (Settings -> Secrets and variables -> Actions -> Variables).
  # The runner must be provisioned with a logged-in `codex` CLI —
  # scripts/smoke-e2e.mjs exits 2 when codex is not logged in, which fails this job.
  e2e-live:
    name: live codex e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.CODEX_E2E_ENABLED == 'true' }}
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
